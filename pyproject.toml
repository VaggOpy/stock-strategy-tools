[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradetool"
version = "0.1.0"
description = "Tools for analysing and evaluating stock trading strategies with LLMs (UTH special topic)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: test needs internet access (deselect with -m 'not network')"]
